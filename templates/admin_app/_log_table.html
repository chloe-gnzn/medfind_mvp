{% if logs %}
<div class="table-wrap">
<table class="data">
    <tr><th>When</th><th>Actor</th><th>Action</th><th>Description</th></tr>
    {% for l in logs %}
    <tr>
        <td class="muted">{{ l.created_at|date:"M d, g:i A" }}</td>
        <td><span class="badge">{{ l.actor_type }}</span> {{ l.actor_name }}</td>
        <td>{{ l.action }}</td>
        <td>{{ l.description }}</td>
    </tr>
    {% endfor %}
</table>
</div>
{% else %}<div class="empty">No activity yet.</div>{% endif %}

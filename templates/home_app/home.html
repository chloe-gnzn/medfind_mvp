{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedFind | Home</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="card home-wrapper">
        <div class="brand">
            <div class="logo">MedFind</div>
        </div>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <h1>HOME SCREEN</h1>
        <p>Welcome, {{ user.username }}! You're logged in.</p>

        <a href="{% url 'logout' %}" class="btn-logout">Log Out</a>
    </div>
</body>
</html>
